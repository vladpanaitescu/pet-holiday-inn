name: Deploy Hostico

# Fiecare push pe main urcă site-ul în public_html pe Hostico (petholidayinn.ro).
# Inactiv până se adaugă secretele FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (GitHub → Settings → Secrets and variables → Actions). Se poate porni și manual.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostico
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Verifică secretele
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "Lipsesc secretele FTP: deploy-ul pe Hostico e sărit."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - name: Pregătește doar fișierele site-ului
        if: steps.check.outputs.ready == 'true'
        run: python3 _tools/pachet.py

      # Urcă doar ce s-a schimbat (ține un fișier de stare pe server); nu șterge nimic de pe server.
      - name: Upload prin FTP în public_html
        if: steps.check.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/site/
