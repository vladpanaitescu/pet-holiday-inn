<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pet Holiday – variante logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&family=Caveat:wght@700&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --forest:#1b2b18; --olive:#8fa83a; --gold:#e9a93b; --cream:#f6eddb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ece4d2; font-family: Nunito, sans-serif; color: var(--forest); }
  header { padding: 48px 24px 10px; max-width: 1240px; margin: 0 auto; }
  h1 { font: 700 44px/1.1 Oswald, sans-serif; text-transform: uppercase; margin: 0 0 6px; }
  header p { margin: 0; color: #5d6556; }
  .grid { max-width: 1240px; margin: 0 auto; padding: 28px 24px 60px; display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 22px; }
  .card { background: #fff; border-radius: 26px; overflow: hidden; box-shadow: 0 20px 40px -30px rgba(0,0,0,.4); }
  /* culori per fundal: c1 principal, c2 accent, c3 al doilea accent, c0 = fundalul (pentru tăieturi) */
  .on-cream { --c0: var(--cream); --c1: var(--forest); --c2: var(--olive); --c3: var(--gold); background: var(--cream); }
  .on-dark  { --c0: var(--forest); --c1: var(--cream); --c2: var(--gold); --c3: var(--gold); background: var(--forest); }
  .on-gold  { --c0: var(--gold); --c1: var(--forest); --c2: var(--forest); --c3: var(--cream); background: var(--gold); }
  .on-olive { --c0: var(--olive); --c1: var(--cream); --c2: var(--forest); --c3: var(--gold); background: var(--olive); }
  .stage { display: grid; place-items: center; padding: 34px 20px 26px; min-height: 320px; }
  .stage svg { width: 180px; height: 180px; display: block; }
  .word { text-align: center; margin-top: 8px; color: var(--c1); }
  .word b { display: block; font: 700 40px/1 Caveat, cursive; }
  .word small { display: block; font: 800 10.5px Nunito; letter-spacing: .28em; text-transform: uppercase; opacity: .7; margin-top: 4px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; }
  .row div { display: grid; place-items: center; height: 116px; }
  .row svg { width: 78px; height: 78px; }
  .meta { padding: 18px 22px 22px; }
  .meta h2 { font: 700 22px Oswald; text-transform: uppercase; margin: 0 0 4px; }
  .meta p { margin: 0; font-size: 14px; color: #5d6556; line-height: 1.5; }
  .meta span { font: 800 12px Nunito; color: var(--olive); letter-spacing: .14em; }
  .fav { display: flex; gap: 12px; align-items: center; margin-top: 12px; font-size: 12px; color: #5d6556; }
  .fav i { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; }
  .fav svg { width: 30px; height: 30px; } .fav i + i svg { width: 16px; height: 16px; }
</style>
</head>

<header>
  <h1>Pet Holiday – 6 direcții de logo</h1>
  <p>Câinele din față, ușor întors spre stânga, cu palmierul aplecat spre dreapta în spate. Fără fundal — se pune peste orice. Vectori simpli, în paleta site-ului: verde pădure, oliv, auriu, crem.</p>
</header>

<main class="grid" id="grid"></main>

<script>
  const items = [
    ["Color", "Câinele cu pălăria de pai, ușor întors spre stânga, cu palmierul aplecat spre dreapta în spate. Varianta principală."],
    ["Silueta", "O singură culoare, siluetă plină. Merge pe broderie, ștampilă, gravură, zgardă."],
    ["Două culori", "Totul verde închis, doar pălăria și zgarda aurii. Sobru, dar tot jucăuș."],
    ["Urechi sus", "Fără pălărie: câinele cu urechile ciulite, palmierul oliv aplecat în spatele lui."],
    ["Linie", "Desen liniar, curat. Bun pentru semnalistică și materiale tipărite."],
    ["Doar capul", "Capul mare cu pălăria și palmierul — pentru avatar de Instagram și favicon."]
  ];
  const grid = document.getElementById("grid");
  items.forEach(([name, desc], i) => {
    const id = "L" + (i + 1), svg = c => `<svg viewBox="0 0 120 120"><use href="#${id}"/></svg>`;
    grid.insertAdjacentHTML("beforeend", `
      <article class="card">
        <div class="stage on-cream">${svg()}<div class="word"><b>Pet Holiday</b><small>Hotel pentru animale</small></div></div>
        <div class="row"><div class="on-dark">${svg()}</div><div class="on-cream" style="background:#fff">${svg()}</div></div>
        <div class="meta"><span>0${i + 1}</span><h2>${name}</h2><p>${desc}</p>
          <div class="fav">Favicon: <i class="on-dark">${svg()}</i><i class="on-cream">${svg()}</i></div></div>
      </article>`);
  });
</script>
